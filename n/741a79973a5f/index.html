<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>نوري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --cream:#f0ede6; --ink:#2d2a28; --org:#ee9637; --muted:#8a857f;
  --line:#e4e0d7; --pencil:#9a948c; --paper:#f7f5f0;
  --disp:'Readex Pro',system-ui,sans-serif;
  --body:'IBM Plex Sans Arabic',system-ui,sans-serif;
}
*{box-sizing:border-box}
/* العنصر اللي عليه hidden لازم يختفي حتى لو الستايل مديله display */
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:16px;line-height:1.85;
  direction:rtl;text-align:right;
  background-image:radial-gradient(circle at 1px 1px,#0000000a 1px,#0000 0);
  background-size:22px 22px}
.wrap{max-width:880px;margin:0 auto;padding:0 20px 90px}

header.top{padding:54px 0 10px;text-align:center}
header.top h1{font-family:var(--disp);font-size:58px;font-weight:700;
  margin:0;letter-spacing:-1px}
header.top .sub{color:var(--muted);font-size:15px;margin:6px 0 0}
header.top .note{display:inline-block;margin-top:14px;font-size:12.5px;
  color:#8a5a14;background:#fff8ef;border:1px solid #f0dcc0;
  border-radius:999px;padding:5px 14px}

/* شريط واحد ثابت فوق: القطة والمؤشر. لما تنزل بيتحوّل لسطر واحد
   رفيع والقطة بتصغر جنبه — عشان ماتغطّيش الكلام */
#hud{position:sticky;top:0;z-index:6;background:var(--paper);
  display:flex;flex-direction:column;align-items:center;
  padding:10px 0 8px;transition:padding .35s}
#hud.small{flex-direction:row-reverse;gap:14px;justify-content:center;
  align-items:center;padding:7px 0;border-bottom:1px solid var(--line);
  box-shadow:0 8px 18px -14px #2d2a2840}
#stage{display:flex;justify-content:center;gap:7px;padding:0 0 4px}
#hud.small #stage{padding:0}
#stage i{width:26px;height:4px;border-radius:3px;background:#dcd7cd;
  transition:background .4s,width .4s}
#stage i.on{background:var(--org);width:38px}

#catwrap{display:flex;justify-content:center;margin:2px 0 6px}
#cat{width:min(290px,56vw);height:auto;overflow:visible;
  transition:width .45s ease}
#hud.small #catwrap{margin:0}
#hud.small #cat{width:54px}
#cat .ly{opacity:0;transition:opacity .7s ease}
#cat .ly.on{opacity:1}
#cat.done #g0{opacity:0}
#cat .cons{fill:none;stroke:#cfc8bc;stroke-width:1.4;stroke-dasharray:5 6}
#cat .sil{fill:var(--paper);stroke:var(--ink);stroke-width:5;
  stroke-linejoin:round;stroke-linecap:round}
#cat .ink2{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round}
#cat .nose{fill:var(--ink)}
#cat .eye{fill:#a9c75f;stroke:var(--ink);stroke-width:3}
#cat .pup{fill:var(--ink)}
#cat .mark{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;
  stroke-linejoin:round}
#cat .spot{fill:var(--ink);opacity:.82}
#cat .collar{fill:none;stroke:var(--org);stroke-width:9;stroke-linecap:round}
#cat .buckle{fill:#d9d4c8;stroke:var(--ink);stroke-width:2.5}

.sec{margin:0 0 20px;border-radius:16px;padding:22px 24px 10px;
  opacity:.35;transform:translateY(16px);
  transition:opacity .6s,transform .6s}
.sec.vis{opacity:1;transform:none}
.sec header{display:flex;gap:14px;align-items:flex-start;margin-bottom:10px}
.sec .num{font-family:var(--disp);font-style:normal;font-weight:700;
  font-size:22px;line-height:1.1;color:var(--org);min-width:52px}
.sec .num span{color:#c9c3b8;font-size:13px}
.sec h2{font-family:var(--disp);font-size:27px;font-weight:700;margin:0}
.sec .kick{margin:2px 0 0;color:var(--muted);font-size:14.5px}

.pencil{background:#fbfaf7;border:1.6px dashed #cfc8bc;color:#5b564f;
  transform:rotate(-.25deg)}
.pencil.vis{transform:rotate(-.25deg)}
.pencil h2{color:#5b564f;font-weight:600}
.pencil .num{color:#b5aea3}
.ink{background:#fff;border:1.6px solid #d9d4ca;
  box-shadow:0 2px 0 #2d2a280d}
.final{background:var(--cream);border:1.6px solid #d6cfc0;
  border-right:5px solid var(--org);
  box-shadow:0 14px 34px #2d2a2814}

.bd p{margin:0 0 14px}
.bd ul,.bd ol{margin:0 0 14px;padding-right:20px}
.bd li{margin-bottom:7px}
.big{font-family:var(--disp);font-size:21px;font-weight:600;
  line-height:1.65;border-right:4px solid var(--org);
  padding:2px 14px 2px 0;margin:16px 0}
.test,.rule{background:#fff8ef;border:1px solid #f0dcc0;border-radius:12px;
  padding:12px 15px;color:#7a4e12;font-weight:600}
.warn{background:#fdf0ee;border:1px solid #f2cfc8;border-radius:12px;
  padding:12px 15px;color:#8c3a2c}
table{width:100%;border-collapse:collapse;margin:0 0 14px;font-size:14.5px}
th,td{border:1px solid var(--line);padding:9px 11px;text-align:right;
  vertical-align:top}
th{background:#efece5;font-family:var(--disp);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.two>div{border-radius:12px;padding:14px 16px}
.two .do{background:#eef3ee;border:1px solid #d6e2d6}
.two .dont{background:#fdf0ee;border:1px solid #f2cfc8}
.two b{font-family:var(--disp);display:block;margin-bottom:6px}
.two ul{padding-right:18px;margin:0}
footer{text-align:center;color:var(--muted);font-size:13px;padding:30px 0 0}

#lockwrap{min-height:100vh;display:flex;align-items:center;
  justify-content:center;padding:20px}
.lock{background:#fff;border:1px solid var(--line);border-radius:18px;
  padding:30px 28px;max-width:400px;width:100%;text-align:center;
  box-shadow:0 18px 50px #2d2a2814}
.lock h1{font-family:var(--disp);font-size:34px;margin:0 0 4px}
.lock p{color:var(--muted);font-size:14px;margin:0 0 18px}
.lock input{font-family:var(--body);font-size:16px;padding:12px 14px;
  width:100%;border:1px solid var(--line);border-radius:11px;
  text-align:center;direction:ltr}
.lock button{margin-top:12px;width:100%;padding:12px;border:0;
  border-radius:11px;background:var(--ink);color:#fff;font-size:15.5px;
  font-family:var(--disp);font-weight:600;cursor:pointer}
.lock .er{color:#b3382a;font-size:13.5px;min-height:20px;margin-top:9px}
@media(max-width:620px){
  header.top h1{font-size:42px}
  .sec{padding:18px 16px 6px}
  .sec h2{font-size:22px}
  .two{grid-template-columns:1fr}
}
</style></head><body>
<div id="lockwrap"><div class="lock">
  <h1>نوري</h1><p>الصفحة مقفولة. اكتب كلمة السر.</p>
  <input id="pw" type="password" autocomplete="off" placeholder="كلمة السر">
  <button id="go">افتح</button><div class="er" id="er"></div>
</div></div>

<script>
const el=i=>document.getElementById(i);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),
    'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.rounds,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},
    key,b64(ENC.data));
  return JSON.parse(new TextDecoder().decode(pt));
}
function start(d){
  el('app').innerHTML=d.html;
  el('lockwrap').hidden=true; el('app').hidden=false;
  const secs=[...document.querySelectorAll('.sec')];
  const dots=el('stage');
  dots.innerHTML=secs.map(()=>'<i></i>').join('');
  const di=[...dots.children];
  const io=new IntersectionObserver(es=>{
    es.forEach(e=>{
      const n=+e.target.dataset.stage;
      if(e.isIntersecting){
        e.target.classList.add('vis');
        // الرسمة بتتقفل طبقة طبقة مع النزول
        for(let k=0;k<=n;k++){
          const g=el('g'+k); if(g) g.classList.add('on');
        }
        di.forEach((x,k)=>x.classList.toggle('on',k<=n));
      }
    });
  },{rootMargin:'-18% 0px -45% 0px'});
  secs.forEach(s=>io.observe(s));
  const g0=el('g0'); if(g0) g0.classList.add('on');
  const hud=el('hud'), cat=el('cat');
  const last=secs.length-1;
  addEventListener('scroll',()=>{
    hud.classList.toggle('small', scrollY>380);
  },{passive:true});
  // الخطوط الإنشائية بتختفي لما التكوين يتم
  new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting) cat.classList.add('done'); });
  },{rootMargin:'0px 0px -30% 0px'}).observe(secs[last]);
}
(function(){
  const go=el('go'),er=el('er'),inp=el('pw');
  async function tryPw(pw,quiet){
    go.disabled=true; er.textContent=quiet?'':'بيفتح…';
    try{ const d=await unlock(pw);
      try{localStorage.setItem('nouripw',pw);}catch(e){}
      start(d); return true;
    }catch(e){ go.disabled=false; if(!quiet) er.textContent='كلمة السر غلط';
      return false; }
  }
  go.onclick=()=>tryPw(inp.value.trim(),false);
  inp.onkeydown=e=>{if(e.key==='Enter')go.onclick();};
  let saved=null; try{saved=localStorage.getItem('nouripw');}catch(e){}
  if(saved) tryPw(saved,true).then(ok=>{if(!ok)go.disabled=false;});
  inp.focus();
})();
</script>
