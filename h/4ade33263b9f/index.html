<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><title>حواديت نورماندي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--cream:#f0ede6;--ink:#2d2a28;--org:#ee9637;--muted:#8a857f;--line:#e4e0d7;--paper:#f7f5f0;
--disp:'Readex Pro',system-ui,sans-serif;--body:'IBM Plex Sans Arabic',system-ui,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.85;direction:rtl;text-align:right}
.wrap{max-width:900px;margin:0 auto;padding:0 18px 80px}
header.top{padding:46px 0 6px;text-align:center}header.top h1{font-family:var(--disp);font-size:50px;margin:0}
header.top .sub{color:var(--muted);margin:4px 0 0}
nav.toc{position:sticky;top:0;z-index:5;background:var(--paper);display:flex;gap:6px;overflow-x:auto;padding:10px 0;margin:10px 0 18px;border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch}
nav.toc a{flex:none;font-size:13px;padding:4px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);text-decoration:none}
.sec{margin:0 0 20px;border-radius:16px;padding:22px 22px 10px;background:var(--cream);border:1.6px solid #d6cfc0;border-right:5px solid var(--org);scroll-margin-top:60px}
.sec header{display:flex;gap:12px;align-items:flex-start;margin-bottom:8px}
.sec .num{font-family:var(--disp);font-style:normal;font-weight:700;font-size:22px;color:var(--org);min-width:44px}
.sec h2{font-family:var(--disp);font-size:26px;margin:0}.sec .kick{margin:2px 0 0;color:var(--muted);font-size:14.5px}
.sec h3{font-family:var(--disp);font-size:19px;margin:26px 0 8px}.kick2{color:var(--muted);font-size:14.5px}
.bd p{margin:0 0 12px}.bd ul,.bd ol{padding-right:20px;margin:0 0 12px}.bd li{margin-bottom:6px}
.big{font-family:var(--disp);font-size:20px;font-weight:600;line-height:1.65;border-right:4px solid var(--org);padding:2px 14px 2px 0;margin:10px 0 16px}
.rule{background:#fff8ef;border:1px solid #f0dcc0;border-radius:12px;padding:12px 15px;color:#7a4e12;font-weight:600;margin:12px 0}
table{width:100%;border-collapse:collapse;margin:0 0 14px;font-size:14.5px;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:right;vertical-align:top;background:#fff}th{background:#efece5;font-family:var(--disp)}
.sbgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:8px 0 18px}
.fr{margin:0}.fr svg{width:100%;height:auto;display:block}.fr figcaption{font-size:12.5px;line-height:1.6;color:#5b564f;margin-top:5px}
.ep{background:#fff;border:1px solid var(--line);border-radius:13px;margin:12px 0;padding:6px 14px 10px}
.ep h4{margin:8px 0 4px;font-family:var(--disp);font-size:16.5px}
.b{display:flex;gap:10px;padding:7px 0;border-top:1px dashed var(--line)}
.t{flex:0 0 44px;font-weight:700;color:var(--org);font-size:13px;direction:ltr;text-align:right;padding-top:2px}
.b p{margin:0}.v{color:var(--muted);font-size:13.5px}.y{color:var(--org);font-weight:700}
.star{background:var(--org);color:#fff;border-radius:6px;padding:0 7px;font-size:12px;margin-inline-start:6px}
h3.sh{color:var(--org)}
footer{text-align:center;color:var(--muted);font-size:13px;padding:24px 0 0}
#lockwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lock{background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px 26px;max-width:400px;width:100%;text-align:center;box-shadow:0 18px 50px #2d2a2814}
.lock h1{font-family:var(--disp);font-size:30px;margin:0 0 4px}.lock p{color:var(--muted);font-size:14px;margin:0 0 18px}
.lock input{font-family:var(--body);font-size:16px;padding:12px;width:100%;border:1px solid var(--line);border-radius:11px;text-align:center;direction:ltr}
.lock button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:11px;background:var(--ink);color:#fff;font-size:15.5px;font-family:var(--disp);cursor:pointer}
.lock .er{color:#b3382a;font-size:13.5px;min-height:20px;margin-top:9px}

.sbidx{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}.sbidx a{font-size:13px;padding:4px 11px;border-radius:999px;background:var(--ink);color:#fff;text-decoration:none}
.sbset{background:#fff;border:1.6px solid #d9d4ca;border-radius:14px;padding:12px 14px;margin:18px 0}
.sbset>summary{list-style:none;cursor:pointer}.sbset>summary::-webkit-details-marker{display:none}.sbset>summary::after{content:'＋';margin-inline-start:8px;color:var(--org);font-weight:700}.sbset[open]>summary::after{content:'－'}.sbset:not([open]) .sbhead{border-bottom:0;margin-bottom:0;padding-bottom:0}
.sbhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;border-bottom:2px solid var(--org);padding-bottom:6px;margin-bottom:6px}
.sbhead small{color:var(--muted);font-size:13px}.sbhead b{font-family:var(--disp);font-size:21px;color:var(--org)}.sbhead span{margin-inline-start:auto;font-size:12.5px;color:var(--muted)}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0}.plan{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 12px}
.plan h4{margin:2px 0 6px;font-family:var(--disp);font-size:16px}.plan svg{width:100%;height:auto;display:block;border-radius:8px}.plan ul{font-size:14px;margin-top:8px}
.legend{font-size:13px;color:#5b564f;background:#fff;border:1px dashed var(--line);border-radius:10px;padding:7px 11px}
.gear{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 12px}.gi{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px}
.gi svg{width:92px;flex:none;height:auto}.gi b{font-family:var(--disp)}.gi p{margin:3px 0;font-size:14px}.gi .price{color:var(--org);font-weight:700}
.links a{display:inline-block;margin:4px 0 0 6px;font-size:13px;padding:3px 10px;border-radius:8px;background:#232f3e;color:#fff;text-decoration:none}.nolink{font-size:13px;color:var(--muted)}
details.q{background:#fff;border:1px solid var(--line);border-radius:12px;margin:10px 0}details.q>summary{cursor:pointer;padding:10px 14px;font-family:var(--disp);font-weight:600}
table.cal{margin:0}table.cal td{font-size:13.5px}table.cal small{color:var(--muted)}small.nt{color:#b3382a!important}
i.sc{font-style:normal;font-size:11px;background:#eef3ee;color:#2e6b3a;border-radius:6px;padding:0 5px;white-space:nowrap}
.s-a{color:#b8621b;font-weight:600}.s-b{color:#7a4e12;font-weight:600}.s-c{color:#2e6b8a;font-weight:600}.s-d{color:#6b4a2b;font-weight:600}.s-e{color:#7a3d8a;font-weight:600}.s-f{color:#2e6b3a;font-weight:600}.s-g{color:#a3352b;font-weight:600}
i.st{font-style:normal;font-size:11.5px;border-radius:6px;padding:0 6px;white-space:nowrap}i.ok{background:#e7f3e8;color:#2e6b3a}i.idea{background:#fff4dc;color:#8a5a00}i.wait{background:#eeeeee;color:#666}
.gloss{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0 14px;font-size:14px}.gloss div{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px}.gloss i{font-style:normal;font-weight:700;color:var(--org);font-size:16px}
@media(max-width:620px){.plans,.gear{grid-template-columns:1fr}.gi svg{width:76px}}
@media(max-width:760px){.sbgrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:620px){header.top h1{font-size:36px}.wrap{padding:0 12px 60px}.sec{padding:16px 14px 6px}.sec h2{font-size:21px}
.sbgrid{grid-template-columns:repeat(2,1fr)}th,td{padding:7px 8px;font-size:13.5px}}
</style></head><body>

async function unlock(pw){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.rounds,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.data));return JSON.parse(new TextDecoder().decode(pt));}
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;const x=document.querySelector(a.getAttribute('href'));if(x&&x.tagName==='DETAILS')x.open=true;});
function start(d){el('app').innerHTML=d.html;el('lockwrap').hidden=true;el('app').hidden=false;if(location.hash){const t=document.querySelector(location.hash);if(t)t.scrollIntoView();}}
(function(){const go=el('go'),er=el('er'),inp=el('pw');
async function tryPw(pw,quiet){go.disabled=true;er.textContent=quiet?'':'بيفتح…';
try{const d=await unlock(pw);try{localStorage.setItem('hawadeetpw',pw);}catch(e){}start(d);return true;}
catch(e){go.disabled=false;if(!quiet)er.textContent='كلمة السر غلط';return false;}}
go.onclick=()=>tryPw(inp.value.trim(),false);inp.onkeydown=e=>{if(e.key==='Enter')go.onclick();};
let saved=null;try{saved=localStorage.getItem('hawadeetpw');}catch(e){}if(saved)tryPw(saved,true);inp.focus();})();</script></body></html>
