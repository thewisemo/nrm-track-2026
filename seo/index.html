<script>const el=i=>document.getElementById(i);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey('raw',
    new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.rounds,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},
    key,b64(ENC.data));
  return JSON.parse(new TextDecoder().decode(pt));
}

  document.body.style.color='#141414';
}
(function(){
  const go=el('go'),er=el('er'),inp=el('pw');
  async function tryPw(pw,quiet){
    if(!pw){return false;}
    go.disabled=true; er.textContent=quiet?'':'بيفتح…';
    try{ const d=await unlock(pw);
      try{localStorage.setItem(KEY,pw);}catch(e){}
      start(d); return true;
    }catch(e){ go.disabled=false;
      if(!quiet) er.textContent='كلمة السر غلط'; return false; }
  }
  go.onclick=()=>tryPw(inp.value.trim(),false);
  inp.onkeydown=e=>{if(e.key==='Enter')go.onclick();};
  let saved=null; try{saved=localStorage.getItem(KEY);}catch(e){}
  if(saved) tryPw(saved,true).then(ok=>{if(!ok)go.disabled=false;});
  inp.focus();
})();
</script>
</body></html>
