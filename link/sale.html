<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الحفلة — نورماندي شوز</title>
<meta name="description" content="موسم عروض نورماندي شوز — الموديلات والأسعار والمدة، وكل فروعنا.">
<meta name="theme-color" content="#F0EDE6">
<meta property="og:title" content="الحفلة — نورماندي شوز">
<meta property="og:description" content="موسم العروض: الموديلات والأسعار والمدة">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--cream:#F0EDE6;--ink:#2D2A28;--or:#EE9637;--mut:#8a8580;--line:#e4e0d7;
      --card:#fff;--soft:#F7F4EE;--sale:#b2503a;--r:20px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:url(pattern.png) center/620px;opacity:.28;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:0 16px 70px}
h2{font-size:20px;font-weight:900;margin:32px 0 13px;display:flex;align-items:center;gap:10px}
h2::after{content:'';flex:1;height:1px;background:var(--line)}

.stick{position:sticky;top:0;z-index:30;margin:0 -16px 0;transition:transform .3s cubic-bezier(.2,.7,.3,1)}
.stick.up{transform:translateY(-104%)}
.topnav{display:flex;align-items:center;gap:10px;background:rgba(240,237,230,.94);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:10px 16px;border-bottom:1px solid var(--line);box-shadow:0 10px 24px -22px rgba(45,42,40,.9)}
.topnav .lg img{width:106px;display:block}
.topnav .nv{margin-inline-start:auto;display:flex;gap:6px}
.topnav .nv a{text-decoration:none;color:#5d574f;font-size:13px;font-weight:800;
  border:1.5px solid var(--line);background:#fff;border-radius:100px;padding:6px 12px}
.topnav .nv a.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---------- الهيدر ---------- */
.hero{position:relative;background:var(--ink);color:var(--cream);border-radius:26px;
  padding:30px 22px;margin-top:16px;text-align:center;overflow:hidden}
.hero::before{content:'';position:absolute;inset:-50% -20% auto;height:220%;
  background:radial-gradient(60% 50% at 50% 0,rgba(238,150,55,.32),transparent 70%)}
.hero>*{position:relative}
.hero .mark{display:block;margin:0 auto 14px;max-width:62%;max-height:96px}
.hero .wordmark{font-size:46px;font-weight:900;color:var(--or);line-height:1;letter-spacing:-1px}
.hero h1{font-size:25px;font-weight:900;margin-top:12px;line-height:1.35}
.hero p{font-size:14.5px;color:#c2bcb3;font-weight:600;line-height:1.75;margin-top:10px}
.dates{display:inline-flex;align-items:center;gap:8px;margin-top:16px;background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.16);border-radius:100px;padding:8px 16px;font-size:13.5px;font-weight:800}
.cd{display:flex;justify-content:center;gap:9px;margin-top:16px}
.cd div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:14px;
  min-width:62px;padding:9px 6px}
.cd b{display:block;font-size:24px;font-weight:900;color:var(--or);line-height:1.1}
.cd span{display:block;font-size:11px;font-weight:700;color:#b6b0a8;margin-top:3px}

/* ---------- الموديلات ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;
  text-decoration:none;color:inherit;box-shadow:0 2px 10px rgba(45,42,40,.05);
  transition:transform .15s ease,box-shadow .2s ease;position:relative;display:block}
.card:active{transform:scale(.985)}
@media(hover:hover){.card:hover{transform:translateY(-3px);box-shadow:0 14px 28px -14px rgba(45,42,40,.35)}}
.card img{width:100%;aspect-ratio:900/702;object-fit:contain;background:linear-gradient(180deg,#fff 55%,#faf7f2);padding:4px;display:block}
.card .in{padding:10px 13px 14px}
.card b{display:block;font-size:14.5px;font-weight:800;line-height:1.35}
.card .cd2{font-size:12.5px;font-weight:800;color:var(--or);direction:ltr;text-align:right;margin-top:2px}
.card .pr{margin-top:8px;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.card .now{font-size:18px;font-weight:900;color:var(--sale)}
.card .was{font-size:13px;font-weight:700;color:var(--mut);text-decoration:line-through}
.card .cur{font-size:11.5px;font-weight:700;color:var(--mut)}
.off{position:absolute;inset-inline-start:10px;top:10px;background:var(--sale);color:#fff;
  border-radius:100px;padding:4px 10px;font-size:12px;font-weight:900;z-index:2}

.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px;margin-bottom:11px}
.box b{display:block;font-size:16px;font-weight:900;margin-bottom:8px}
.box li{font-size:13.5px;color:#6f6a64;font-weight:600;line-height:1.95;list-style:none;
  padding-inline-start:16px;position:relative}
.box li::before{content:'';position:absolute;inset-inline-start:0;top:12px;width:5px;height:5px;
  border-radius:50%;background:var(--or)}
.btn{display:block;text-align:center;background:var(--or);color:#fff;text-decoration:none;
  border-radius:100px;padding:14px;font-size:15.5px;font-weight:900;
  box-shadow:0 12px 24px -8px rgba(238,150,55,.55);margin-top:12px}
.btn.g{background:#fff;color:var(--ink);border:1.6px solid var(--ink);box-shadow:none}

/* ---------- الموسم مقفول ---------- */
.off-state{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:30px 22px;text-align:center}
.off-state .ic{width:64px;height:64px;border-radius:50%;background:var(--soft);margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center}
.off-state .ic svg{width:28px;height:28px;fill:var(--or)}
.off-state b{display:block;font-size:20px;font-weight:900;margin-bottom:8px}
.off-state p{font-size:14px;color:#6f6a64;font-weight:600;line-height:1.85}
footer{text-align:center;margin-top:36px;font-size:12px;color:var(--mut);font-weight:700;line-height:2}
footer a{color:var(--mut)}
.skel{height:220px;border-radius:20px;background:linear-gradient(90deg,#f3f0ea,#faf8f4,#f3f0ea);
  background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
</style></head>
<body>
<div class="wrap">
<div class="stick" id="stick">
  <nav class="topnav">
    <a class="lg" href="index.html"><img src="logo.png" alt="نورماندي شوز"></a>
    <div class="nv"><a href="models.html">التشكيلة</a><a href="index.html">الفروع</a><a href="sale.html" class="on">الحفلة</a></div>
  </nav>
</div>

<div id="main"><div class="skel" style="margin-top:16px"></div></div>

<footer>نورماندي شوز · من أول خطوة<br><a href="models.html">التشكيلة</a> · <a href="index.html">الفروع</a> · <a href="warranty.html">الضمان</a></footer>
</div>

<script>
var arn=function(n){return String(n).replace(/[0-9]/g,function(c){return '٠١٢٣٤٥٦٧٨٩'[+c]})};
var money=function(n){return arn(Number(n).toLocaleString('en-US'))};
var q=new URLSearchParams(location.search);
var KEEP=['utm_source','utm_medium','utm_campaign','utm_content','src','post','m'];
function passthru(){var o={};KEEP.forEach(function(k){if(q.get(k))o[k]=q.get(k)});return o}
var LOG='';
function beacon(p){ if(!LOG)return; try{ navigator.sendBeacon(LOG+'?'+new URLSearchParams(Object.assign({page:'sale'},passthru(),p))) }catch(e){} }

var AR_MONTH=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function fmt(d){ var x=new Date(d); if(isNaN(x))return ''; return arn(x.getDate())+' '+AR_MONTH[x.getMonth()]; }

function render(S,models,cur){
  var main=document.getElementById('main');
  if(!S || !S.on){
    main.innerHTML =
      '<div class="off-state" style="margin-top:16px"><div class="ic">'
      +'<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 10.6-3.5 2-.9-1.6 2.4-1.4V6h2z"/></svg></div>'
      +'<b>'+(S&&S.closed_title||'الموسم مش مفتوح دلوقتي')+'</b>'
      +'<p>'+(S&&S.closed_note||'لما يبدأ الموسم الجاي هتلاقي هنا الموديلات والأسعار والمدة.<br>ولحد ما يفتح، التشكيلة كاملة بمقاساتها موجودة على طول.')+'</p>'
      +'<a class="btn" href="models.html">شوف التشكيلة</a>'
      +'<a class="btn g" href="index.html">الفروع والمواعيد</a></div>';
    beacon({ev:'view',state:'closed'});
    return;
  }
  var items=(S.models||[]).map(function(x){
    var m=models.filter(function(y){return String(y.code)===String(x.code)})[0]||{};
    var was=Number(x.was||m.price||0), now=Number(x.now||m.sale||0);
    var off = (was>0&&now>0&&now<was)? Math.round((was-now)/was*100) : 0;
    return {code:x.code, name:x.name||m.name||('موديل '+x.code), img:m.img||'', was:was, now:now, off:off};
  });
  var logo = S.logo
    ? '<img class="mark" src="'+S.logo+'" alt="'+(S.name||'الحفلة')+'">'
    : '<div class="wordmark">'+(S.name||'الحفلة')+'</div>';
  var dates = (S.from||S.to)
    ? '<div class="dates">من '+fmt(S.from)+' لـ '+fmt(S.to)+'</div>' : '';
  var cards = items.length
    ? '<div class="grid">'+items.map(function(i){
        return '<a class="card" href="m/'+i.code+'.html">'
          +(i.off?'<span class="off">خصم '+arn(i.off)+'٪</span>':'')
          +(i.img?'<img src="'+i.img+'" alt="'+i.name+'" loading="lazy">':'')
          +'<div class="in"><b>'+i.name+'</b><div class="cd2">'+i.code+'</div>'
          +(i.now? '<div class="pr"><span class="now">'+money(i.now)+'</span><span class="cur">'+cur+'</span>'
                   +(i.was?'<span class="was">'+money(i.was)+'</span>':'')+'</div>'
                 : '<div class="pr"><span class="cur">السعر في الفرع</span></div>')
          +'</div></a>';
      }).join('')+'</div>'
    : '<div class="box"><b>الموديلات بتتحدّد قبل بداية الموسم</b><li>لما تتعتمد، هتظهر هنا بأكوادها وأسعارها قبل وبعد.</li></div>';

  main.innerHTML =
    '<div class="hero">'+logo
    +(S.title?'<h1>'+S.title+'</h1>':'')
    +(S.sub?'<p>'+S.sub+'</p>':'')
    +dates
    +'<div class="cd" id="cd"></div></div>'
    +'<h2>موديلات الموسم</h2>'+cards
    +'<h2>شروط الموسم</h2><div class="box"><b>اقرا قبل ما تنزل</b>'
    +((S.terms&&S.terms.length?S.terms:[
        'العرض في كل الفروع وبنفس السعر.',
        'العرض لحد نهاية المدة أو لحد ما الكمية تخلص.',
        'الضمان زي ما هو — ٣ شهور على النعل والغرزة.',
        'الاستبدال متاح ١٤ يوم بالفاتورة والشوز بحالته.'
      ]).map(function(t){return '<li>'+t+'</li>'}).join(''))
    +'</div>'
    +'<a class="btn" href="models.html">شوف التشكيلة كاملة</a>'
    +'<a class="btn g" href="index.html">أقرب فرع ليك</a>';

  beacon({ev:'view',state:'open',id:S.key||'sale'});
  if(S.to) tick(S.to);
}

function tick(to){
  var el=document.getElementById('cd'); if(!el) return;
  var end=new Date(to); end.setHours(23,59,59,999);
  function up(){
    var ms=end-new Date();
    if(isNaN(end)||ms<=0){ el.innerHTML=''; return; }
    var dd=Math.floor(ms/864e5), hh=Math.floor(ms/36e5)%24, mm=Math.floor(ms/6e4)%60;
    el.innerHTML='<div><b>'+arn(dd)+'</b><span>يوم</span></div>'
                +'<div><b>'+arn(hh)+'</b><span>ساعة</span></div>'
                +'<div><b>'+arn(mm)+'</b><span>دقيقة</span></div>';
  }
  up(); setInterval(up,30000);
}

Promise.all([
  fetch('config.json?v='+Date.now()).then(function(r){return r.json()}).catch(function(){return {}}),
  fetch('models.json?v='+Date.now()).then(function(r){return r.json()}).catch(function(){return {}})
]).then(function(a){
  var cfg=a[0]||{}, M=a[1]||{};
  LOG=cfg.log_endpoint||'';
  render(cfg.sale, M.models||[], M.currency||'جنيه');
}).catch(function(){ render(null,[],'جنيه'); });

(function(){
  var s=document.getElementById('stick'); if(!s) return;
  var last=0,t=false;
  addEventListener('scroll',function(){ if(t)return; t=true;
    requestAnimationFrame(function(){ t=false;
      var y=Math.max(0,scrollY), d=y-last;
      if(y<90) s.classList.remove('up'); else if(d>8) s.classList.add('up'); else if(d<-8) s.classList.remove('up');
      last=y; }); },{passive:true});
})();
</script>
</body></html>
