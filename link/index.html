<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نورماندي شوز — من أول خطوة</title>
<meta name="description" content="فروع نورماندي شوز ومواعيدها، الضمان، والأسئلة المتكررة. تواصل معانا في ثانية.">
<meta property="og:title" content="نورماندي شوز — من أول خطوة">
<meta property="og:description" content="الفروع والمواعيد والضمان والتواصل">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--cream:#F0EDE6;--ink:#2D2A28;--or:#EE9637;--mut:#8a8580;--line:#e4e0d7;--ok:#2e8b5a}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--cream);color:var(--ink);
  background-image:url(pattern.png);background-size:620px;min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:26px 18px 60px}
header{text-align:center;padding:10px 0 4px}
header img{width:210px;max-width:62%}
header p{margin-top:12px;font-size:15px;color:#6f6a64;font-weight:600;line-height:1.6}
h2{font-size:21px;font-weight:900;margin:30px 0 12px;display:flex;align-items:center;gap:9px}
h2::after{content:'';flex:1;height:1px;background:var(--line)}
.ch{display:flex;align-items:center;gap:13px;background:#fff;border:1px solid var(--line);
  border-radius:20px;padding:15px 17px;margin-bottom:11px;text-decoration:none;color:inherit;
  box-shadow:0 2px 10px rgba(45,42,40,.04);transition:transform .15s ease,box-shadow .15s ease}
.ch:active{transform:scale(.985)}
.ch.pri{background:var(--or);border-color:var(--or);color:#fff;box-shadow:0 10px 24px rgba(238,150,55,.3)}
.ch .ico{width:44px;height:44px;border-radius:14px;background:var(--cream);flex:0 0 44px;
  display:flex;align-items:center;justify-content:center}
.ch.pri .ico{background:rgba(255,255,255,.22)}
.ch .ico svg{width:22px;height:22px;fill:currentColor}
.ch b{display:block;font-size:17px;font-weight:800}
.ch small{display:block;font-size:12.5px;font-weight:600;opacity:.62;margin-top:1px}
.ch .arw{margin-right:auto;font-size:17px;opacity:.45}
.br{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px 17px;margin-bottom:11px}
.br .top{display:flex;align-items:center;gap:12px}
.br .pin{width:42px;height:42px;border-radius:13px;background:var(--cream);flex:0 0 42px;
  display:flex;align-items:center;justify-content:center;font-size:19px}
.br h3{font-size:17px;font-weight:800}
.br small{display:block;font-size:12.5px;color:var(--mut);font-weight:600;margin-top:2px}
.br .acts{display:flex;gap:9px;margin-top:12px}
.br .acts a{flex:1;text-align:center;border:1.5px solid var(--line);border-radius:14px;
  padding:9px;font-size:13.5px;font-weight:800;text-decoration:none;color:var(--ink)}
.br .acts a.o{border-color:var(--or);color:var(--or)}
details{background:#fff;border:1px solid var(--line);border-radius:18px;padding:0 17px;margin-bottom:9px;overflow:hidden}
summary{list-style:none;cursor:pointer;padding:15px 0;font-size:15.5px;font-weight:800;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:'+';color:var(--or);font-size:21px;font-weight:900;line-height:1}
details[open] summary::after{content:'−'}
details p{font-size:13.5px;color:#6f6a64;font-weight:600;line-height:1.75;padding-bottom:16px;margin-top:-2px}
.war{background:var(--ink);color:var(--cream);border-radius:22px;padding:22px;text-align:center;margin-top:8px}
.war b{display:block;font-size:34px;font-weight:900;color:var(--or);line-height:1}
.war h3{font-size:19px;font-weight:900;margin:6px 0 6px}
.war p{font-size:13.5px;color:#b6b0a8;font-weight:600;line-height:1.7}
footer{text-align:center;margin-top:34px;font-size:12px;color:var(--mut);font-weight:700}
.offers{display:block;background:var(--ink);color:var(--cream);border-radius:20px;padding:17px;
  text-align:center;text-decoration:none;font-weight:900;font-size:18px;margin-bottom:11px}
.offers span{display:block;font-size:12.5px;font-weight:600;color:#b6b0a8;margin-top:3px}
@media (prefers-reduced-motion:no-preference){
  .ch,.br,details{animation:up .5s cubic-bezier(.2,.7,.3,1) backwards}
  @keyframes up{from{opacity:0;transform:translateY(12px)}}
}
</style></head>
<body>
<div class="wrap">
  <header>
    <img src="logo.png" alt="نورماندي شوز">
    <p id="tag"></p>
  </header>

  <a id="offersBtn" class="offers" style="display:none" href="#"></a>

  <h2>تواصل معانا</h2>
  <div id="channels"></div>

  <h2>الفروع والمواعيد</h2>
  <div id="branches"></div>

  <h2>الضمان</h2>
  <div class="war">
    <b>٣ شهور</b>
    <h3>ضمان حقيقي</h3>
    <p>على النعل والغرزة. تيجي بالفاتورة لأي فرع<br>ويتم الاستبدال أو الإصلاح من غير أي تكلفة.</p>
  </div>

  <h2>أسئلة بتتكرر</h2>
  <div id="faq"></div>

  <footer>نورماندي شوز · من أول خطوة</footer>
</div>

<script>
const ICO={
 wa:'<svg viewBox="0 0 24 24"><path d="M17.5 14.4c-.3-.2-1.7-.8-2-.9s-.5-.2-.7.2-.8.9-1 1.1-.4.2-.7 0a8 8 0 0 1-2.4-1.5 9 9 0 0 1-1.6-2c-.2-.3 0-.5.1-.7l.5-.6.3-.5v-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4a3.2 3.2 0 0 0-1 2.4 5.6 5.6 0 0 0 1.2 3 12.7 12.7 0 0 0 4.9 4.3c2.3 1 2.3.6 2.7.6a2.9 2.9 0 0 0 1.9-1.4 2.4 2.4 0 0 0 .2-1.3zM12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2z"/></svg>',
 msg:'<svg viewBox="0 0 24 24"><path d="M12 2C6.3 2 2 6.2 2 11.7c0 3.1 1.4 5.9 3.7 7.7v3.4l3.4-1.9c.9.3 1.9.4 2.9.4 5.7 0 10-4.2 10-9.6S17.7 2 12 2zm1 12.9-2.6-2.7-5 2.7 5.5-5.8 2.6 2.7 4.9-2.7-5.4 5.8z"/></svg>',
 ig:'<svg viewBox="0 0 24 24"><path d="M12 2.2c3.2 0 3.6 0 4.9.1 3.3.1 4.8 1.7 4.9 4.9.1 1.3.1 1.6.1 4.8s0 3.6-.1 4.9c-.1 3.2-1.6 4.8-4.9 4.9-1.3.1-1.6.1-4.9.1s-3.6 0-4.9-.1c-3.3-.2-4.8-1.7-4.9-4.9-.1-1.3-.1-1.6-.1-4.9s0-3.5.1-4.8C2.3 4 3.8 2.4 7.1 2.3c1.3-.1 1.7-.1 4.9-.1zm0 5a4.8 4.8 0 1 0 0 9.6 4.8 4.8 0 0 0 0-9.6zm0 7.9a3.1 3.1 0 1 1 0-6.2 3.1 3.1 0 0 1 0 6.2zm6.1-8.1a1.1 1.1 0 1 1-2.3 0 1.1 1.1 0 0 1 2.3 0z"/></svg>',
 tel:'<svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>'
};
const q=new URLSearchParams(location.search);
const KEEP=['utm_source','utm_medium','utm_campaign','utm_content','src','post','m'];
function passthru(){const o={};KEEP.forEach(k=>{if(q.get(k))o[k]=q.get(k)});return o}
function go(kind,key,url,extra){
  const p=new URLSearchParams(Object.assign({to:url,k:kind,id:key,from:'hub'},passthru(),extra||{}));
  return 'go.html?'+p.toString();
}
fetch('config.json?v='+Date.now()).then(r=>r.json()).then(C=>{
  document.getElementById('tag').textContent='الفروع والمواعيد والضمان — وتواصل معانا في ثانية.';
  if(C.offers && C.offers.on && C.offers.url){
    const o=document.getElementById('offersBtn');
    o.style.display='block';
    o.innerHTML=(C.offers.label||'العروض')+'<span>اضغط تشوف الموديلات والأسعار</span>';
    o.href=go('offers','offers',C.offers.url);
  }
  const ch=document.getElementById('channels');
  const on=(C.channels||[]).filter(c=>c.on && c.url && !/XXXX/.test(c.url));
  if(!on.length){ch.innerHTML='<div class="ch"><div class="ico">💬</div><div><b>قريباً</b><small>قنوات التواصل بتتظبط دلوقتي</small></div></div>';}
  on.forEach((c,i)=>{
    const a=document.createElement('a');
    a.className='ch'+(i===0?' pri':'');
    a.href=go('channel',c.key,c.url);
    a.innerHTML=`<div class="ico">${ICO[c.key]||''}</div><div><b>${c.label}</b><small>${c.sub||''}</small></div><span class="arw">←</span>`;
    a.style.animationDelay=(i*60)+'ms';
    ch.appendChild(a);
  });
  const bs=document.getElementById('branches');
  (C.branches||[]).forEach((b,i)=>{
    const acts=[];
    if(b.map)   acts.push(`<a class="o" href="${go('map',b.key,b.map)}">الخريطة</a>`);
    if(b.phone) acts.push(`<a href="${go('call',b.key,'tel:'+b.phone)}">اتصال</a>`);
    const d=document.createElement('div');
    d.className='br';
    d.innerHTML=`<div class="top"><div class="pin">📍</div><div><h3>فرع ${b.name}</h3><small>${b.hours||''}</small></div></div>`
      +(acts.length?`<div class="acts">${acts.join('')}</div>`:'');
    d.style.animationDelay=(i*50)+'ms';
    bs.appendChild(d);
  });
  const fq=document.getElementById('faq');
  (C.faq||[]).forEach((f,i)=>{
    const d=document.createElement('details');
    if(i===0)d.open=true;
    d.innerHTML=`<summary>${f.q}</summary><p>${f.a}</p>`;
    d.style.animationDelay=(i*40)+'ms';
    fq.appendChild(d);
  });
  window.__LOG=C.log_endpoint||'';
  try{sessionStorage.setItem('nrm_log',window.__LOG)}catch(e){}
  // page view
  if(window.__LOG){
    const p=Object.assign({ev:'view',page:'hub',ref:document.referrer||''},passthru());
    navigator.sendBeacon?navigator.sendBeacon(window.__LOG+'?'+new URLSearchParams(p)):0;
  }
}).catch(()=>{});
</script>
</body></html>
