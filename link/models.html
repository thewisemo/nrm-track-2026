<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نورماندي شوز — التشكيلة</title>
<meta name="description" content="تشكيلة نورماندي شوز — اختار فرعك ومقاسك وشوف الموديلات قبل ما تنزل.">
<meta property="og:title" content="نورماندي شوز — التشكيلة">
<meta property="og:description" content="اختار فرعك ومقاسك وشوف الموديلات">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--cream:#F0EDE6;--ink:#2D2A28;--or:#EE9637;--mut:#8a8580;--line:#e4e0d7;--ok:#2e8b5a}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--cream);color:var(--ink);
  background-image:url(pattern.png);background-size:620px;min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 70px}
header{text-align:center;padding:6px 0 2px}
header img{width:170px;max-width:52%}
h1{font-size:23px;font-weight:900;margin:16px 0 4px;text-align:center}
.lead{text-align:center;font-size:14px;color:#6f6a64;font-weight:600;line-height:1.7}
.stick{position:sticky;top:0;z-index:20;margin:0 -16px 14px;
  transition:transform .3s cubic-bezier(.2,.7,.3,1)}
.stick.up{transform:translateY(-102%)}
.topnav{display:flex;align-items:center;gap:10px;background:rgba(240,237,230,.96);backdrop-filter:blur(10px);
  padding:10px 16px;border-bottom:1px solid var(--line)}
.topnav .lg{display:block;line-height:0}
.topnav .lg img{width:112px;display:block}
.topnav .nv{margin-inline-start:auto;display:flex;gap:6px}
.topnav .nv a{text-decoration:none;color:#5d574f;font-size:13px;font-weight:800;
  border:1.5px solid var(--line);background:#fff;border-radius:100px;padding:6px 12px}
.topnav .nv a.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar{background:rgba(240,237,230,.93);backdrop-filter:blur(10px);
  padding:12px 16px 10px;border-bottom:1px solid var(--line);box-shadow:0 10px 24px -22px rgba(45,42,40,.9)}
.fab{position:fixed;inset-inline-start:50%;transform:translate(50%,90px);bottom:18px;z-index:40;
  border:0;background:var(--ink);color:#fff;border-radius:100px;padding:11px 20px;font-family:inherit;
  font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 12px 30px rgba(45,42,40,.32);
  transition:transform .28s cubic-bezier(.2,.7,.3,1);opacity:.97}
.fab.on{transform:translate(50%,0)}
.done{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px 16px}
.done b{display:block;font-size:15.5px;font-weight:900;color:var(--ok);margin-bottom:9px}
.done .msg{background:#f7f4ee;border:1px dashed #d8d2c7;border-radius:12px;padding:11px 13px;
  font-size:14px;font-weight:700;line-height:1.7;transition:background .3s}
.done p{font-size:13px;color:#6f6a64;font-weight:600;line-height:1.7;margin:10px 0 12px}
.done .btn.g{margin-top:9px}
.clr{flex:0 0 auto;border:1.5px dashed #cfc8bd;background:transparent;color:#8a8580;border-radius:100px;
  padding:8px 14px;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap}
.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(to left,#000 88%,transparent 100%);
  mask-image:linear-gradient(to left,#000 88%,transparent 100%)}
.row::-webkit-scrollbar{display:none}
.row+.row{margin-top:8px}
.lbl{font-size:12px;font-weight:800;color:var(--mut);margin:0 2px 5px}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;color:#57524c;border-radius:100px;
  padding:8px 15px;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap}
.chip.on{border-color:var(--or);background:var(--or);color:#fff;box-shadow:0 6px 16px rgba(238,150,55,.28)}
.count{margin:14px 0 10px;font-size:13.5px;font-weight:700;color:#6f6a64}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;cursor:pointer;
  box-shadow:0 2px 10px rgba(45,42,40,.04);transition:transform .15s ease,box-shadow .15s ease}
.card:active{transform:scale(.985)}
.card .ph{width:100%;aspect-ratio:900/702;background:#fff;display:block;object-fit:contain}
.card .in{padding:10px 13px 14px}
.card b{display:block;font-size:15px;font-weight:800;line-height:1.35}
.card .cd{font-size:12.5px;font-weight:800;color:var(--or);direction:ltr;text-align:right;margin-top:2px}
.card small{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-top:5px;line-height:1.6}
.price{margin-top:7px;font-size:16px;font-weight:900;color:var(--ink);direction:rtl}
.price small{font-size:12px;font-weight:700;color:var(--mut);margin-inline-start:3px}
.price .old{font-size:13px;font-weight:700;color:var(--mut);text-decoration:line-through;
  margin-inline-start:7px}
.price .now{color:#b2503a}
.price.ask{font-size:13px;font-weight:800;color:var(--mut)}
.pbig{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px 16px;margin-bottom:12px;
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pbig b{font-size:26px;font-weight:900}
.pbig small{font-size:13px;font-weight:700;color:var(--mut)}
.pbig .old{font-size:15px;font-weight:700;color:var(--mut);text-decoration:line-through}
.pbig .sv{margin-inline-start:auto;background:#f7ecea;color:#b2503a;border-radius:100px;
  padding:4px 11px;font-size:12px;font-weight:800}
.tag{display:inline-block;margin-top:9px;border-radius:100px;padding:3px 10px;font-size:11.5px;font-weight:800}
.tag.ask{background:#f2efe9;color:#6b655d}.tag.yes{background:#e8f3ec;color:var(--ok)}
.tag.no{background:#f7ecea;color:#b2503a}
.empty{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px 20px;text-align:center}
.empty b{display:block;font-size:17px;font-weight:900;margin-bottom:6px}
.empty p{font-size:13.5px;color:#6f6a64;font-weight:600;line-height:1.75}
.sheet{position:fixed;inset:0;background:rgba(30,28,26,.55);display:none;z-index:60}
.sheet.on{display:block}
.sheet .in{position:absolute;inset-inline:0;bottom:0;margin:0 auto;background:var(--cream);
  width:100%;max-width:560px;border-radius:26px 26px 0 0;max-height:92svh;max-height:92vh;
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:0 18px 34px;animation:up .3s cubic-bezier(.2,.7,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
.sheet .grab{width:44px;height:5px;border-radius:99px;background:#d8d2c7;margin:9px auto 0}
.sheet .hd{position:sticky;top:0;background:var(--cream);z-index:3;
  display:flex;align-items:flex-start;gap:12px;padding:12px 0 10px;
  box-shadow:0 10px 14px -14px rgba(45,42,40,.5)}
.sheet h3{font-size:21px;font-weight:900;flex:1;line-height:1.3}
.sheet .x{border:0;background:var(--ink);color:#fff;border-radius:100px;padding:7px 14px;
  font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;flex:0 0 auto}

.gal{margin-bottom:12px}
.gmain{display:flex;gap:0;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  border-radius:18px;background:#fff;border:1px solid var(--line)}
.gmain::-webkit-scrollbar{display:none}
.gmain figure{flex:0 0 100%;scroll-snap-align:center;margin:0;position:relative}
.gmain img{width:100%;display:block;aspect-ratio:1/1;object-fit:contain;background:#fff}
.gmain figcaption{position:absolute;inset-inline-end:10px;bottom:10px;background:rgba(45,42,40,.78);
  color:#fff;border-radius:100px;padding:4px 11px;font-size:11.5px;font-weight:800}
.gthumbs{display:flex;gap:7px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.gthumbs::-webkit-scrollbar{display:none}
.gthumbs button{flex:0 0 auto;width:58px;height:58px;padding:0;border-radius:14px;overflow:hidden;
  border:1.5px solid var(--line);background:#fff;cursor:pointer}
.gthumbs button.on{border-color:var(--or);box-shadow:0 0 0 2px rgba(238,150,55,.22)}
.gthumbs img{width:100%;height:100%;object-fit:contain;display:block}
.gdots{display:flex;gap:5px;justify-content:center;margin-top:9px}
.gdots i{width:6px;height:6px;border-radius:50%;background:#d8d2c7;transition:background .2s}
.gdots i.on{background:var(--or)}
.oneang{font-size:12px;color:var(--mut);font-weight:700;text-align:center;margin-top:8px}
.kv{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.kv span{background:#fff;border:1px solid var(--line);border-radius:100px;padding:6px 13px;
  font-size:12.5px;font-weight:800}
.sheet p.d{font-size:14.5px;font-weight:600;color:#5d574f;line-height:1.85;margin-bottom:14px}
.av{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:14px}
.av b{display:block;font-size:13px;color:var(--mut);font-weight:800;margin-bottom:9px}
.av .sz{display:flex;gap:7px;flex-wrap:wrap}
.av .sz i{font-style:normal;border-radius:12px;padding:7px 12px;font-size:13.5px;font-weight:800;
  background:#f2efe9;color:#6b655d}
.av .sz i.yes{background:#e8f3ec;color:var(--ok)}.av .sz i.no{background:#f7ecea;color:#b2503a;opacity:.7}
.btn{display:block;width:100%;text-align:center;background:var(--or);color:#fff;border:0;border-radius:100px;
  padding:15px;font-family:inherit;font-size:16px;font-weight:900;text-decoration:none;cursor:pointer;
  box-shadow:0 10px 24px rgba(238,150,55,.3)}
.btn.g{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none;margin-top:9px}
footer{text-align:center;margin-top:30px;font-size:12px;color:var(--mut);font-weight:700}
footer a{color:var(--mut)}
.note{background:#fff;border:1px dashed var(--line);border-radius:16px;padding:12px 15px;
  font-size:12.5px;color:#6f6a64;font-weight:600;line-height:1.7;margin-top:14px}
</style></head>
<body>
<div class="wrap">
  <div class="stick" id="stick">
   <nav class="topnav">
     <a class="lg" href="index.html"><img src="logo.png" alt="نورماندي شوز"></a>
     <div class="nv">
       <a href="models.html" class="on">التشكيلة</a>
       <a href="index.html">الفروع</a>
       <a href="warranty.html">الضمان</a>
     </div>
   </nav>
   <div class="bar">
    <div class="lbl">الفرع</div>
    <div class="row" id="brs"></div>
    <div class="lbl" style="margin-top:9px">المقاس</div>
    <div class="row" id="szs"></div>
    <div class="lbl" style="margin-top:9px">الاستخدام</div>
    <div class="row" id="uss"></div>
   </div>
  </div>
  <h1 style="margin-top:4px">التشكيلة</h1>
  <p class="lead">اختار فرعك ومقاسك .. وشوف اللي يناسبك قبل ما تنزل.</p>


  <div class="count" id="cnt"></div>
  <div class="grid" id="grid"></div>
  <div id="none"></div>
  <div class="note" id="note"></div>

  <footer>
    <a href="index.html">الفروع والتواصل</a> · <a href="warranty.html">تفعيل الضمان</a><br><br>
    نورماندي شوز · من أول خطوة
  </footer>
</div>

<button class="fab" id="fab" onclick="showBar(1)">الفلاتر ↑</button>
<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="in" id="sheetin"></div></div>

<script>
var C={}, M=[], BR=[], SZ=[], US=[], LOG='', CH=[], PR={}, CUR='جنيه';
var st={br:'',sz:0,us:'الكل'};
var q=new URLSearchParams(location.search);
var KEEP=['utm_source','utm_medium','utm_campaign','utm_content','src','post','m'];
function passthru(){var o={};KEEP.forEach(function(k){if(q.get(k))o[k]=q.get(k)});return o}
function arn(n){return String(n).replace(/[0-9]/g,function(c){return '٠١٢٣٤٥٦٧٨٩'[+c]})}
function beacon(p){ if(!LOG)return; try{
  var u=LOG+(LOG.indexOf('?')>-1?'&':'?')+new URLSearchParams(Object.assign(p,passthru())).toString();
  if(navigator.sendBeacon) navigator.sendBeacon(u); else (new Image()).src=u;
}catch(e){} }
function go(kind,key,url,extra){
  var p=new URLSearchParams(Object.assign({to:url,k:kind,id:key,from:'models'},passthru(),extra||{}));
  return 'go.html?'+p.toString();
}
/* حالة التوفر: متاح / مش متاح / مش معروف */
function stockOf(code,br,size){
  var s=(C.stock||{})[code];
  if(!s||!br) return null;
  var r=s[br]; if(!r) return null;
  if(Array.isArray(r)) return r.indexOf(size)>-1;
  if(typeof r==='object'){ var v=r[String(size)]; if(v===undefined) return null; return !!v && v!=='0'; }
  return null;
}
function fits(m){
  if(st.us!=='الكل' && m.use!==st.us) return false;
  if(st.sz){
    if((m.sizes||[]).indexOf(st.sz)<0) return false;
    var s=stockOf(m.code,st.br,st.sz);
    if(s===false) return false;
  }
  return true;
}
function chip(txt,on,fn){
  var b=document.createElement('button'); b.className='chip'+(on?' on':'');
  b.textContent=txt; b.onclick=fn; return b;
}
function build(){
  var e=document.getElementById('brs'); e.innerHTML='';
  e.appendChild(chip('كل الفروع',!st.br,function(){st.br='';render()}));
  BR.forEach(function(b){ e.appendChild(chip(b.name,st.br===b.key,function(){st.br=b.key;beacon({ev:'filter',k:'branch',id:b.key,page:'models'});render()})); });
  e=document.getElementById('szs'); e.innerHTML='';
  e.appendChild(chip('كل المقاسات',!st.sz,function(){st.sz=0;render()}));
  SZ.forEach(function(s){ e.appendChild(chip(arn(s),st.sz===s,function(){st.sz=s;beacon({ev:'filter',k:'size',id:s,page:'models'});render()})); });
  e=document.getElementById('uss'); e.innerHTML='';
  US.forEach(function(u){ e.appendChild(chip(u,st.us===u,function(){st.us=u;beacon({ev:'filter',k:'use',id:u,page:'models'});render()})); });
  if(st.br||st.sz||st.us!=='الكل'){
    var c=document.createElement('button'); c.className='clr'; c.textContent='مسح الفلاتر ✕';
    c.onclick=function(){st.br='';st.sz=0;st.us='الكل';render()};
    e.appendChild(c);
  }
}
/* الفلتر بيتحفظ في اللينك — يعني اللينك اللي تبعته بيفتح على نفس الاختيار */
function syncURL(){
  var p=new URLSearchParams(location.search);
  st.br?p.set('b',st.br):p.delete('b');
  st.sz?p.set('s',st.sz):p.delete('s');
  st.us!=='الكل'?p.set('u',st.us):p.delete('u');
  var s=p.toString();
  history.replaceState(null,'',location.pathname+(s?'?'+s:''));
}
function render(){
  build();
  var list=M.filter(fits);
  var g=document.getElementById('grid'); g.innerHTML='';
  list.forEach(function(m){
    var s=st.sz?stockOf(m.code,st.br,st.sz):null;
    var tag = s===true?'<span class="tag yes">متوفر</span>'
            : s===false?'<span class="tag no">خلص</span>'
            : '<span class="tag ask">اسأل الفرع</span>';
    var d=document.createElement('div'); d.className='card';
    d.onclick=function(){openModel(m)};
    d.innerHTML='<img class="ph" loading="lazy" src="'+m.img+'" alt="'+m.name+'">'
      +'<div class="in"><b>'+m.name+'</b><div class="cd">'+m.code+'</div>'
      +'<small>'+(m.color||'')+'</small>'+priceSmall(m)+tag+'</div>';
    g.appendChild(d);
  });
  var bits=[];
  if(st.br) bits.push('فرع '+((BR.filter(function(b){return b.key===st.br})[0]||{}).name||''));
  if(st.sz) bits.push('مقاس '+arn(st.sz));
  if(st.us!=='الكل') bits.push(st.us);
  document.getElementById('cnt').textContent =
    list.length? arn(list.length)+' موديل'+(bits.length?' — '+bits.join(' · '):'') : '';
  document.getElementById('none').innerHTML = list.length? '' :
    '<div class="empty"><b>مفيش موديل بالمواصفات دي</b><p>جرّب تغيّر المقاس أو الاستخدام، أو كلّم الفرع وإحنا نشوفلك حل.</p></div>';
  syncURL();
}
/* الفلاتر بتختفي مع النزول وبترجع مع أول سكرول لفوق */
var lastY=0, ticking=false, stickEl, fabEl;
function showBar(scroll){
  stickEl.classList.remove('up'); fabEl.classList.remove('on');
  if(scroll) window.scrollTo({top:0,behavior:'smooth'});
}
function hideBar(){ stickEl.classList.add('up'); fabEl.classList.add('on'); }
function onScroll(){
  if(ticking) return; ticking=true;
  requestAnimationFrame(function(){
    ticking=false;
    if(document.getElementById('sheet').classList.contains('on')){lastY=window.scrollY;return}
    var y=Math.max(0,window.scrollY), d=y-lastY;
    if(y<90) showBar(0);
    else if(d>8) hideBar();
    else if(d<-8) showBar(0);
    lastY=y;
  });
}
function money(n){ return arn(Number(n).toLocaleString('en-US')); }
function priceOf(m){
  var p=Number((PR[m.code]&&PR[m.code].p)||m.price||0);
  var s=Number((PR[m.code]&&PR[m.code].s)||m.sale||0);
  return {p:p, s:(s>0&&s<p)?s:0};
}
function priceSmall(m){
  var x=priceOf(m);
  if(!x.p) return '<div class="price ask">السعر في الفرع</div>';
  if(x.s) return '<div class="price"><span class="now">'+money(x.s)+'</span><small>'+CUR+'</small>'
                +'<span class="old">'+money(x.p)+'</span></div>';
  return '<div class="price">'+money(x.p)+'<small>'+CUR+'</small></div>';
}
function priceBig(m){
  var x=priceOf(m);
  if(!x.p) return '<div class="pbig"><b style="font-size:17px;color:var(--mut)">السعر في الفرع</b></div>';
  if(x.s) return '<div class="pbig"><b style="color:#b2503a">'+money(x.s)+'</b><small>'+CUR+'</small>'
    +'<span class="old">'+money(x.p)+'</span>'
    +'<span class="sv">وفّر '+money(x.p-x.s)+' '+CUR+'</span></div>';
  return '<div class="pbig"><b>'+money(x.p)+'</b><small>'+CUR+'</small>'
    +'<span class="sv" style="background:#f2efe9;color:#6b655d">السعر واحد في كل الفروع</span></div>';
}
var ANG={side:'الجنب',side2:'الجنب التاني',front:'من قدام',back:'من ورا',top:'من فوق',sole:'النعل'};
function angles(m){
  var a=[];
  if(m.imgs && m.imgs.length){
    m.imgs.forEach(function(x){
      if(typeof x==='string') a.push({u:x,t:''});
      else a.push({u:x.u,t:ANG[x.t]||x.t||''});
    });
  }
  if(!a.length) a.push({u:m.img,t:''});
  return a;
}
function gallery(m){
  var a=angles(m);
  if(a.length<2)
    return '<div class="gal"><div class="gmain"><figure><img src="'+a[0].u+'" alt="'+m.name+'"></figure></div>'
         + '<div class="oneang">صورة واحدة دلوقتي — باقي الزوايا بتتضاف أول ما توصل</div></div>';
  return '<div class="gal">'
    +'<div class="gmain" id="gmain">'
    + a.map(function(x){return '<figure><img loading="lazy" src="'+x.u+'" alt="'+m.name+'">'
        +(x.t?'<figcaption>'+x.t+'</figcaption>':'')+'</figure>'}).join('')
    +'</div>'
    +'<div class="gthumbs" id="gthumbs">'
    + a.map(function(x,i){return '<button class="'+(i?'':'on')+'" onclick="goAng('+i+')">'
        +'<img src="'+x.u+'" alt=""></button>'}).join('')
    +'</div>'
    +'<div class="gdots" id="gdots">'+a.map(function(_,i){return '<i class="'+(i?'':'on')+'"></i>'}).join('')+'</div>'
    +'</div>';
}
/* الصفحة RTL — في المتصفحات الحديثة scrollLeft بيبقى بالسالب، فبنشتغل بالإشارة والمطلق */
function angSign(g){ return getComputedStyle(g).direction==='rtl' ? -1 : 1; }
function goAng(i){
  var g=document.getElementById('gmain'); if(!g) return;
  g.scrollTo({left:angSign(g)*g.clientWidth*i,behavior:'smooth'});
}
function angSync(){
  var g=document.getElementById('gmain'); if(!g) return;
  var i=Math.round(Math.abs(g.scrollLeft)/g.clientWidth);
  ['gthumbs','gdots'].forEach(function(id){
    var e=document.getElementById(id); if(!e) return;
    [].forEach.call(e.children,function(c,k){ c.className=(k===i?(id==='gdots'?'on':'on'):''); });
  });
}
function openModel(m){
  beacon({ev:'model',k:'model',id:m.code,page:'models',s:st.sz||'',b:st.br||''});
  var sizes=(m.sizes||[]).map(function(s){
    var v=stockOf(m.code,st.br,s);
    return '<i class="'+(v===true?'yes':v===false?'no':'')+'">'+arn(s)+'</i>';
  }).join('');
  var ch=CH.filter(function(c){return c.key==='msg'&&c.on&&c.url})[0]
        || CH.filter(function(c){return c.on&&c.url&&!/XXXX/.test(c.url)})[0];
  var brn=st.br?((BR.filter(function(b){return b.key===st.br})[0]||{}).name||''):'';
  var msg='مهتم بموديل '+m.code+(st.sz?' مقاس '+st.sz:'')+(brn?' .. فرع '+brn:'');
  ASK={msg:msg, code:m.code, size:st.sz||'', br:st.br||'',
       url: ch? go('channel',ch.key, ch.url, {m:m.code,s:st.sz||''}) : 'index.html'};
  document.getElementById('sheetin').innerHTML=
    '<div class="grab"></div>'
    +'<div class="hd"><h3>'+m.name+'</h3><button class="x" onclick="closeSheet()">إغلاق ✕</button></div>'
    +gallery(m)
    +'<div class="kv"><span style="color:var(--or);direction:ltr">'+m.code+'</span>'
      +'<span>'+m.use+'</span>'+(m.color?'<span>'+m.color+'</span>':'')+'</div>'
    +priceBig(m)
    +'<p class="d">'+m.desc+'</p>'
    +'<div class="av"><b>المقاسات'+(st.br?' — فرع '+(BR.filter(function(b){return b.key===st.br})[0]||{}).name:'')+'</b><div class="sz">'+sizes+'</div>'
      +(Object.keys(C.stock||{}).length?'':'<p style="font-size:12px;color:var(--mut);font-weight:600;margin-top:10px;line-height:1.7">المخزون لسه مش متوصّل — كلّم الفرع يأكدلك المقاس.</p>')
    +'</div>'
    +'<div id="askbox"><button class="btn" onclick="askNow()">اسأل عن الموديل ده على ماسنجر</button></div>'
    +'<a class="btn g" href="index.html">الفروع والمواعيد</a>';
  document.getElementById('sheet').classList.add('on');
  document.body.style.overflow='hidden';
  document.getElementById('sheetin').scrollTop=0;
  var g=document.getElementById('gmain'); if(g) g.addEventListener('scroll',angSync,{passive:true});
}
/* الماسنجر مبيقبلش رسالة جاهزة — فبننسخها للعميل ونفتحله المحادثة */
var ASK=null;
function askNow(){
  if(!ASK) return;
  try{ navigator.clipboard.writeText(ASK.msg); }catch(e){}
  try{
    var ta=document.createElement('textarea'); ta.value=ASK.msg; ta.style.position='fixed'; ta.style.opacity=0;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  }catch(e){}
  beacon({ev:'model_ask',k:'model',id:ASK.code,s:ASK.size,b:ASK.br,page:'models'});
  document.getElementById('askbox').innerHTML=
    '<div class="done"><b>نسخنا رسالتك ✓</b>'
   +'<div class="msg" id="askmsg">'+ASK.msg+'</div>'
   +'<p>افتح ماسنجر والصقها وابعتها — وهنرد عليك بالتوفر في أقرب فرع.</p>'
   +'<a class="btn" href="'+ASK.url+'">افتح ماسنجر ←</a>'
   +'<button class="btn g" onclick="copyAsk()">انسخ الرسالة تاني</button></div>';
}
function copyAsk(){
  var t=document.getElementById('askmsg');
  try{ navigator.clipboard.writeText(t.textContent); }catch(e){}
  t.style.background='#e8f3ec';
  setTimeout(function(){t.style.background=''},700);
}
function closeSheet(){document.getElementById('sheet').classList.remove('on');document.body.style.overflow='';ASK=null}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});
stickEl=document.getElementById('stick'); fabEl=document.getElementById('fab');
window.addEventListener('scroll',onScroll,{passive:true});

Promise.all([
  fetch('models.json?v='+Date.now()).then(function(r){return r.json()}),
  fetch('config.json?v='+Date.now()).then(function(r){return r.json()}).catch(function(){return {}})
]).then(function(a){
  C=a[0]; var cfg=a[1]||{};
  LOG=cfg.log_endpoint||''; CH=cfg.channels||[];
  M=C.models||[]; BR=C.branches||[]; SZ=C.sizes||[]; US=C.uses||['الكل']; CUR=C.currency||'جنيه';
  st.br=q.get('b')||''; st.sz=+(q.get('s')||0); st.us=q.get('u')||'الكل';
  document.getElementById('note').textContent=C.note||'';
  render();
  beacon({ev:'view',page:'models',ref:document.referrer||''});
  // المخزون الحيّ من الشيت لو متوصّل
  var EP=(cfg.warranty&&cfg.warranty.endpoint)||LOG||'';
  if(EP){
    var ctl=new AbortController(); setTimeout(function(){try{ctl.abort()}catch(e){}},3000);
    fetch(EP+(EP.indexOf('?')>-1?'&':'?')+'mode=stock',{signal:ctl.signal})
      .then(function(r){return r.json()})
      .then(function(j){
        if(j&&j.ok&&j.prices){ PR=j.prices; render(); }
        if(j&&j.ok&&j.stock){
          C.stock=j.stock; C.updated=j.updated||'';
          if(C.updated){ document.getElementById('note').textContent=
            'التوفر محدّث: '+C.updated+' — ولو المقاس اللي عايزه مش ظاهر، اسأل عنه وإحنا نتأكد لك من الفرع.'; }
          render(); } })
      .catch(function(){});
  }
}).catch(function(){
  document.getElementById('none').innerHTML='<div class="empty"><b>مش قادرين نحمّل التشكيلة</b><p>حاول تاني بعد شوية.</p></div>';
});
</script>
